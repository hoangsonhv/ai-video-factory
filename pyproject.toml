[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-factory"
version = "0.1.0"
description = "CLI-first automated AI video generation pipeline (Idea -> MP4)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
ai-video-factory = "ai_video_factory.interface.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_video_factory"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[dependency-groups]
# The default group `uv run`/`uv sync` install. It must include the type
# checker so `uv run mypy` runs in the same environment as the project's
# dependencies (e.g. jinja2) and can resolve their official (py.typed) types.
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.15.22",
    "pre-commit>=3.7",
]

# jinja2 (3.1+) ships its own py.typed types. This override only suppresses the
# "cannot find stub" error when mypy runs in an environment where jinja2 is not
# installed (e.g. a bare `mypy src`); when jinja2 IS present its real types are
# used. Per-module, not a global disable.
[[tool.mypy.overrides]]
module = ["jinja2", "jinja2.*"]
ignore_missing_imports = true