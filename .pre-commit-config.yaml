# Pre-commit hooks for AI Video Factory.
# Hooks run the project's own pinned tools via `uv run` so they match CI and
# the Makefile exactly. Install with:  uv run pre-commit install
# Run the manual pytest stage with:    uv run pre-commit run --hook-stage manual pytest
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
